<!DOCTYPE html>
<html lang="lv">
<head>
  <!--
    Faila metadati
    Autors: Denis Baglajs
    Versija: 1.0.0
    Pēdējais atjauninājums: 2026-05-22
    Mērķis: Attēlot viena pasākuma detalizētu informāciju.
  -->
  <!-- Dokumenta kodējums -->
  <meta charset="UTF-8" />

  <meta name="author" content="Denis Baglajs" />
  <meta name="version" content="1.0.0" />
  <meta name="last-updated" content="2026-05-22" />
  <meta
    name="description"
    content="Pasākuma detaļu lapa ar aprakstu, cenu, norises vietu un attēliem."
  />

  <!-- Responsīvā dizaina nodrošināšana mobilajām ierīcēm -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Lapas nosaukums pārlūkprogrammas cilnē -->
  <title>Pasākuma detaļas</title>

  <!-- W3.CSS stilu bibliotēka pamata izkārtojumam -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />

  <!-- Projekta kopējais stilu fails -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Lapas galvenais konteiners, kas centrē saturu -->
  <div class="page-wrap">

    <!-- Pasākuma nosaukums (aizpildās dinamiski no JavaScript) -->
    <h1 class="title" id="eventTitle">Pasākuma detaļas</h1>

    <!-- Galvenais pasākuma attēls -->
    <img
      class="main-image"
      id="mainImage"
      alt="Galvenais attēls"
    />

    <!-- Papildu pasākuma attēlu bloks -->
    <!-- Attēli tiek ielādēti dinamiski no API -->
    <div class="details-grid" id="extraImages"></div>

    <!-- Pasākuma detalizētās informācijas panelis -->
    <div class="panel" style="margin-top: 16px;">
      <!-- Pasākuma cena -->
      <p>
        <strong>Cena:</strong>
        <span id="eventPrice"></span>
      </p>

      <!-- Pasākuma datums un laiks -->
      <p>
        <strong>Datums un laiks:</strong>
        <span id="eventDate"></span>
      </p>

      <!-- Pasākuma apraksts -->
      <p><strong>Apraksts:</strong></p>
      <p id="eventDescription"></p>
    </div>

    <!-- Navigācijas poga atgriešanai uz pasākumu sarakstu -->
    <div style="margin-top: 16px; text-align: center;">
      <a class="btn" href="events.html">Atpakaļ</a>
    </div>

    <!-- Statusa vai kļūdu paziņojumu attēlošana -->
    <p class="notice" id="statusMessage"></p>
  </div>

  <!-- JavaScript fails, kas ielādē pasākuma detaļas no REST API -->
  <script src="js/event_details.js"></script>
</body>
</html>
