<!DOCTYPE html>
<html lang="lv">
<head>
  <!-- Dokumenta kodējums -->
  <meta charset="UTF-8" />

  <!-- Responsīvais skats mobilajām ierīcēm -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Lapas nosaukums pārlūkprogrammas cilnē -->
  <title>Pasākumu saraksts</title>

  <!-- W3.CSS bibliotēka pamata izkārtojumam -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css" />

  <!-- Projekta kopējais stilu fails -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Lapas galvenais konteiners, kas centrē visu saturu -->
  <div class="page-wrap">

    <!-- Lapas virsraksts -->
    <h1 class="title">Pasākumu saraksts</h1>

    <!-- Meklēšanas un filtrēšanas panelis -->
    <div class="panel">

      <!-- Filtru un meklēšanas ievades lauki -->
      <div class="controls">

        <!-- Meklēšana pēc pasākuma nosaukuma -->
        <div>
          <label for="search">Meklēt pēc nosaukuma</label>
          <input
            class="w3-input w3-border"
            id="search"
            type="text"
            placeholder="Ieraksti atslēgvārdu"
          />
        </div>

        <!-- Filtrs pēc pasākuma veida -->
        <div>
          <label for="typeFilter">Pasākuma veids</label>
          <select class="w3-select w3-border" id="typeFilter">
            <option value="">Visi veidi</option>
          </select>
        </div>

        <!-- Filtrs pēc pasākuma datuma -->
        <div>
          <label for="dateFilter">Datums</label>
          <input
            class="w3-input w3-border"
            id="dateFilter"
            type="date"
          />
        </div>

        <!-- Filtrs pēc maksimālās cenas -->
        <div>
          <label for="priceFilter">Maksimālā cena</label>
          <input
            class="w3-input w3-border"
            id="priceFilter"
            type="number"
            min="0"
            step="0.01"
            placeholder="0.00"
          />
        </div>

      </div>

      <!-- Navigācijas pogas pasākuma pievienošanai un kategoriju pārvaldībai -->
      <div style="text-align: right;">
        <a class="btn btn-primary" href="event_edit.html">
          Pievienot pasākumu
        </a>
        <a class="btn" href="category_management.html">
          Pārvaldīt kategorijas
        </a>
      </div>
    </div>

    <!-- Pasākumu kartīšu saraksts (aizpildās ar JavaScript) -->
    <div class="events-grid" id="eventsList"></div>

    <!-- Kļūdu vai statusa paziņojumu vieta -->
    <p class="notice" id="statusMessage"></p>
  </div>

  <!-- JavaScript fails pasākumu ielādei, filtrēšanai un attēlošanai -->
  <script src="js/events.js"></script>
</body>
</html>
